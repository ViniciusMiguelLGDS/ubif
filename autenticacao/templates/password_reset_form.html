{% extends 'index.html' %}

{% block conteudo %}
<div class="container mt-5">
    <h4 class="text-center mb-4">Redefinir senha</h4>
    <p>Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group" align="left">
            <label for="id_email">E-mail</label>
            <input type="email" class="form-control" id="id_email" name="email" required autocomplete="off">
            {% for erro in form.email.errors %}<div class="text-danger">{{ erro }}</div>{% endfor %}
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar link</button>
        <a href="{% url 'autenticacao:login' %}" class="btn btn-light w-100 mt-2">Voltar ao login</a>
    </form>
</div>
{% endblock %}
